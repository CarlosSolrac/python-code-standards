[project]
name = "tally-io"
version = "0.1.0"
description = "CSV adapters: read orders, write the revenue report"
requires-python = ">=3.13"
dependencies = [
    "tally-common",
    "tally-core",
]

[tool.uv.sources]
tally-common = { workspace = true }
tally-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
