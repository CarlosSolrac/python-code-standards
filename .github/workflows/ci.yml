name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress; runs on
# main always finish, so every merged commit keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check for Renovate's auto-merge: a dependency PR merges only when
  # every step passes on both systems. The commands are the README's
  # "Verifying the skill itself" list, plus the pass-through checker, the type
  # checkers, and pip-audit.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: python-code-standards
    env:
      SOURCES: skill/tools skill/assets/conformance.py tests evals/grade.py evals/design_spec_grade.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned so a uv release reaches CI only through a Renovate PR, after minimumReleaseAge.
          version: 0.13.8
          enable-cache: true

      - name: Sync the environment from uv.lock
        run: uv sync --locked

      - name: Tests and coverage
        run: uv run pytest --cov=skill.tools --cov=evals.grade --cov=evals.design_spec_grade --cov-branch

      # evals/fixtures/ is deliberately non-conforming, so it is not listed.
      - name: Lint and format
        run: |
          uv run ruff check $SOURCES
          uv run ruff format --check $SOURCES

      - name: Declarations, pass-throughs, and complexity
        run: |
          uv run python skill/tools/check_declarations.py $SOURCES
          uv run python skill/tools/check_passthrough.py $SOURCES
          uv run complexipy skill/tools tests evals/grade.py evals/design_spec_grade.py

      - name: Type checkers
        run: |
          uv run pyright
          uv run mypy $SOURCES

      - name: Dependencies
        run: |
          uv run deptry .
          uv run pip-audit

  # The design-spec Mermaid tools: the validator and the browser viewer. Node
  # 22.22.2 is the oldest version they support, so it stays fixed; Renovate
  # keeps the other entry on the newest Node. The first test run installs the
  # pinned mermaid and jsdom into the shared cache, so this job needs network.
  design-spec:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node:
          - "22.22.2"
          - "26.13.1" # renovate: datasource=node-version depName=node
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Tests and coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include="design-spec/skill/tools/*.mjs"
          --test-coverage-lines=100 --test-coverage-branches=100
          "design-spec/tests/*.test.mjs"

      - name: Every Mermaid diagram in the repository parses
        run: git ls-files -z '*.md' | xargs -0 node design-spec/skill/tools/validate_mermaid.mjs

  # The one stable name that branch protection requires for design-spec: the
  # matrix job names change whenever Renovate bumps a Node version.
  design-spec-ok:
    if: always()
    needs: design-spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every design-spec job passed
        env:
          RESULT: ${{ needs.design-spec.result }}
        run: test "$RESULT" = success

  # Shell and PowerShell scripts: both linters once, then the nightshift hooks'
  # own tests under every shell that runs the hooks on each system (Claude Code
  # runs deny-unattended.sh with bash, Git Bash on Windows; Copilot runs
  # nightshift-hook.ps1 with pwsh, or Windows PowerShell on Windows).
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SHELLCHECK_VERSION: "0.11.0.1" # renovate: datasource=pypi depName=shellcheck-py
      PSSCRIPTANALYZER_VERSION: "1.25.0" # renovate: datasource=nuget depName=PSScriptAnalyzer registryUrl=https://www.powershellgallery.com/api/v2/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.8

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: git ls-files -z '*.sh' | xargs -0 uvx --from "shellcheck-py==$SHELLCHECK_VERSION" shellcheck

      # Imported by version, because the runner image may carry another one.
      - name: PSScriptAnalyzer
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          $findings = @(git ls-files '*.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 })
          $findings | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap
          if ($findings.Count -gt 0) { exit 1 }

      - name: deny-unattended.sh tests (bash)
        run: bash nightshift/hooks/test-deny-unattended.sh

      - name: nightshift-hook.ps1 tests (pwsh)
        shell: pwsh
        run: ./copilot/nightshift/hooks/test-nightshift-hook.ps1 -Shell pwsh

      - name: nightshift-hook.ps1 tests (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\copilot\nightshift\hooks\test-nightshift-hook.ps1 -Shell powershell.exe
