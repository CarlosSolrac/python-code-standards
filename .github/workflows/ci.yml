name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Required check for Renovate's auto-merge: a dependency PR merges only when
  # every step passes on both systems. The commands are the README's
  # "Verifying the skill itself" list, plus the pass-through checker, the type
  # checkers, and pip-audit.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: python-code-standards
    env:
      SOURCES: skill/tools skill/assets/conformance.py tests evals/grade.py evals/design_spec_grade.py
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Sync the environment from uv.lock
        run: uv sync --locked

      - name: Tests and coverage
        run: uv run pytest --cov=skill.tools --cov=evals.grade --cov=evals.design_spec_grade --cov-branch

      # evals/fixtures/ is deliberately non-conforming, so it is not listed.
      - name: Lint and format
        run: |
          uv run ruff check $SOURCES
          uv run ruff format --check $SOURCES

      - name: Declarations, pass-throughs, and complexity
        run: |
          uv run python skill/tools/check_declarations.py $SOURCES
          uv run python skill/tools/check_passthrough.py $SOURCES
          uv run complexipy skill/tools tests evals/grade.py evals/design_spec_grade.py

      - name: Type checkers
        run: |
          uv run pyright
          uv run mypy $SOURCES

      - name: Dependencies
        run: |
          uv run deptry .
          uv run pip-audit
